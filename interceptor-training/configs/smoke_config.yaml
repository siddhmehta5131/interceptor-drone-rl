# smoke_config.yaml -- training settings used by scripts/smoke_test.py.
#
# Identical to configs/config.yaml except that `future_source` is 'pred'.
# The predictor path is the only one that works for EVERY stage, including
# Stage 8 (evasive), which has no closed-form polynomial path to sample from.

global:
  seed: 42
  device: cpu
  data_dir: /data
  n_parallel_envs: 2
  checkpoint_interval_steps: 50000
  tensorboard: true
  execution_mode: sequential

rollback:
  max_attempts: 2
  retry_budget_scale: 0.5
  threshold_scale: 0.5
  min_steps_scale: 0.25

on_capped: continue

observation:
  history_frames: 3
  history_skip: 2
  future_samples: 3
  future_skip: 5
  future_source: pred
  predictor: const_vel

target_alt: 5.0

stages: {}