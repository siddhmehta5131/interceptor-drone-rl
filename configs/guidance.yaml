# Engagement geometry, kill radius and navigation constants (plan P2.5-P2.6,
# P2.9).  Every numeric leaf is {value, unit, source}.

notes: >-
  Kill radius is a stated physical rule, not a tuned success threshold.  Initial
  range follows from a desired time-to-intercept range and the nominal closing
  speed.  Altitude keeps the target above its 35 m floor for the full vertical
  manoeuvre budget.  Episode length is the longest spawn time plus four seconds.

navigation:
  N_prime:
    value: 4.0
    unit: dimensionless
    source: "PROJECT_CHOICE: mid-point of the swept bracket 3-5, used where no per-platform sweep value applies; N' = 3 is LQ-optimal (Palumbo et al. 2010, APL Tech. Dig. 29(1), Eq. 22 p. 49, Eq. 27 p. 51); tested by sweep P5.11 (scripts/sweep_nav.py)"
  # P5.11 sweep (100 evasive episodes per cell, seeds 5000+, all 16 manoeuvres).
  # Selected by kill rate first, median miss second.
  N_prime_by_platform:
    quadcopter:
      apn_raw: {value: 3.0, unit: dimensionless, source: "sweep P5.11 (scripts/sweep_nav.py, 100 episodes, rerun 2026-11-15 with the Förster quad constants; results/tables/nav_sweep.csv). Rule: highest kill rate, then median miss. Kill rates across N' 3-5 differ by at most 5-7 points, inside the 100-episode interval, so the preference is weak"}
      apn_filtered: {value: 3.0, unit: dimensionless, source: "sweep P5.11 (scripts/sweep_nav.py, 100 episodes, rerun 2026-11-15 with the Förster quad constants; results/tables/nav_sweep.csv). Rule: highest kill rate, then median miss. Kill rates across N' 3-5 differ by at most 5-7 points, inside the 100-episode interval, so the preference is weak"}
    fixed_wing:
      apn_raw: {value: 3.0, unit: dimensionless, source: "sweep P5.11 (scripts/sweep_nav.py, 100 episodes, rerun 2026-11-15 with the Förster quad constants; results/tables/nav_sweep.csv). Rule: highest kill rate, then median miss. Kill rates across N' 3-5 differ by at most 5-7 points, inside the 100-episode interval, so the preference is weak"}
      apn_filtered: {value: 3.0, unit: dimensionless, source: "sweep P5.11 (scripts/sweep_nav.py, 100 episodes, rerun 2026-11-15 with the Förster quad constants; results/tables/nav_sweep.csv). Rule: highest kill rate, then median miss. Kill rates across N' 3-5 differ by at most 5-7 points, inside the 100-episode interval, so the preference is weak"}
    missile:
      apn_raw: {value: 3.0, unit: dimensionless, source: "sweep P5.11 (scripts/sweep_nav.py, 100 episodes, rerun 2026-11-15 with the Förster quad constants; results/tables/nav_sweep.csv). Rule: highest kill rate, then median miss. Kill rates across N' 3-5 differ by at most 5-7 points, inside the 100-episode interval, so the preference is weak"}
      apn_filtered: {value: 3.0, unit: dimensionless, source: "sweep P5.11 (scripts/sweep_nav.py, 100 episodes, rerun 2026-11-15 with the Förster quad constants; results/tables/nav_sweep.csv). Rule: highest kill rate, then median miss. Kill rates across N' 3-5 differ by at most 5-7 points, inside the 100-episode interval, so the preference is weak"}
  N_prime_min:
    value: 3.0
    unit: dimensionless
    source: "Palumbo et al. 2010, APL Tech. Dig. 29(1), Eq. 22 p. 49 and Eq. 27 p. 51: effective navigation ratio of the LQ-optimal PN/APN law is 3; EQ-APN-7"
  N_prime_max:
    value: 5.0
    unit: dimensionless
    source: "PROJECT_CHOICE: upper sweep bound; Palumbo et al. 2010 p. 52: higher gains may lead to excessive noise throughput, and above 4 APN needs more acceleration than PN against a hard turn; no published upper bound of 5 found (textbook check is library item L1, docs/library_pending.md); EQ-APN-7"
  t_go_min:
    value: 0.05
    unit: s
    source: "Numerical guard at closest approach; EQ-APN-4"
  t_go_max:
    value: 20.0
    unit: s
    source: "Numerical guard before terminal phase; EQ-APN-4"

engagement:
  quadcopter:
    kill_radius:
      value: 1.3
      unit: m
      source: "Hit-to-kill contact rule r_kill = target half-span + interceptor half-span (EQ-GEO-4); no warhead is assumed because no credible lethal-radius data exists (data/lethality_and_gload.csv): 2.5/2 + 0.092/2 = 1.30 m. Shahed-136 wingspan 2.5 m (IRGC specification poster reported by Janes, https://www.janes.com/osint-insights/defence-news/air/irgc-confirms-specs-for-shahed-136-attack-uav); Crazyflie 2.1 size 92 mm motor-to-motor (Bitcraze datasheet, https://www.bitcraze.io/documentation/hardware/crazyflie_2_1/crazyflie_2_1-datasheet.pdf). Changed 2026-11-14 from 3.0 m"
    r_init_min:
      value: 80.0
      unit: m
      source: "Same 10 s minimum time-to-intercept window as before, scaled to the measured speed class (150 m x 24.0/45); EQ-GEO-5 (project choice). Changed 2026-11-15 for the Förster (2015) motor constants (BUGS #34) from 92 m"
    r_init_max:
      value: 240.0
      unit: m
      source: "Same 25 s maximum time-to-intercept window as before, scaled to the measured speed class (450 m x 24.0/45); EQ-GEO-5 (project choice). Changed 2026-11-15 for the Förster (2015) motor constants (BUGS #34) from 277 m"
    alt_init:
      value: 150.0
      unit: m
      source: "Target floor 35 m + 115 m vertical manoeuvre budget; EQ-GEO-6"
    t_intercept_min:
      value: 10.0
      unit: s
      source: "Guidance geometry design choice; EQ-GEO-5"
    t_intercept_max:
      value: 25.0
      unit: s
      source: "Guidance geometry design choice; EQ-GEO-5"
    max_time:
      value: 18.0
      unit: s
      source: "0.72 x longest spawn time, 25 s; EQ-GEO-5"
  fixed_wing:
    kill_radius:
      value: 3.0
      unit: m
      source: "Hit-to-kill contact rule r_kill = target half-span + interceptor half-span (EQ-GEO-4); no warhead is assumed because no credible lethal-radius data exists (data/lethality_and_gload.csv): 3.1/2 + 2.8956/2 = 3.00 m (Orlan-10 span 3.1 m, Aerosonde 2.8956 m); see configs/platforms.yaml"
    r_init_min:
      value: 400.0
      unit: m
      source: "16 s at 25 m/s nominal closing; EQ-GEO-5"
    r_init_max:
      value: 900.0
      unit: m
      source: "36 s at 25 m/s nominal closing; EQ-GEO-5"
    alt_init:
      value: 1000.0
      unit: m
      source: "Target floor 35 m + 965 m vertical manoeuvre budget; EQ-GEO-6"
    t_intercept_min:
      value: 16.0
      unit: s
      source: "Guidance geometry design choice; EQ-GEO-5"
    t_intercept_max:
      value: 36.0
      unit: s
      source: "Guidance geometry design choice; EQ-GEO-5"
    max_time:
      value: 36.0
      unit: s
      source: "Longest spawn time + 4 s manoeuvre margin; EQ-GEO-5"
  missile:
    kill_radius:
      value: 4.98
      unit: m
      source: "Hit-to-kill contact rule r_kill = target half-span + interceptor half-span (EQ-GEO-4); no warhead is assumed because no credible lethal-radius data exists (data/lethality_and_gload.csv): 9.8/2 + 0.15/2 = 4.98 m; see configs/platforms.yaml"
    r_init_min:
      value: 3500.0
      unit: m
      source: "8.75 s at 400 m/s nominal closing; EQ-GEO-5"
    r_init_max:
      value: 7000.0
      unit: m
      source: "17.5 s at 400 m/s nominal closing; EQ-GEO-5"
    alt_init:
      value: 4500.0
      unit: m
      source: "Target floor 35 m + 4465 m vertical manoeuvre budget; EQ-GEO-6"
    t_intercept_min:
      value: 8.75
      unit: s
      source: "Guidance geometry design choice; EQ-GEO-5"
    t_intercept_max:
      value: 17.5
      unit: s
      source: "Guidance geometry design choice; EQ-GEO-5"
    max_time:
      value: 20.0
      unit: s
      source: "Longest spawn time + 2.5 s manoeuvre margin; EQ-GEO-5"

# Guidance reward (P5.9, decision Q8).  Consumed by
# interceptor/guidance/reward.py::load_reward.  Weights are design choices
# normalised to O(1) terms; source "P5.9" means chosen here and subject to the
# P9.3 sensitivity run, not a measurement.
reward:
  gamma:
    value: 0.99791
    unit: dimensionless
    source: "P5.9: 0.1^(1/1100) keeps 10% of a terminal bonus at step 0; EQ-GUIDE-8"
  w_progress:
    value: 50.0
    unit: dimensionless
    source: "P5.9: potential Phi=-w*d/r_init_max; EQ-GUIDE-1"
  w_align:
    value: 0.35
    unit: dimensionless
    source: "P5.9: notebook alignment weight; EQ-GUIDE-4"
  w_los:
    value: 0.15
    unit: dimensionless
    source: "P5.9: notebook LOS-rate weight; EQ-GUIDE-4"
  w_zem:
    value: 0.25
    unit: dimensionless
    source: "P5.9: notebook ZEM weight; EQ-GUIDE-4"
  w_res_rl:
    value: 0.04
    unit: dimensionless
    source: "P5.9: residual authority penalty in apn_rl mode; EQ-GUIDE-5"
  w_res_pure:
    value: 0.015
    unit: dimensionless
    source: "P5.9: residual authority penalty in pure_rl mode; EQ-GUIDE-5"
  w_smooth:
    value: 0.03
    unit: dimensionless
    source: "P5.9: action-change penalty (motor chatter); EQ-GUIDE-5"
  c_time:
    value: 0.005
    unit: dimensionless
    source: "P5.9: time cost per 20 ms step; EQ-GUIDE-6"
  kill_bonus:
    value: 150.0
    unit: dimensionless
    source: "P5.9: terminal kill bonus; EQ-GUIDE-3"
  kill_speed_bonus:
    value: 50.0
    unit: dimensionless
    source: "P5.9: extra bonus for an early kill, scaled by fraction of episode left; EQ-GUIDE-3"
  crash_penalty:
    value: 80.0
    unit: dimensionless
    source: "P5.9: ground impact; EQ-GUIDE-3"
  diverge_penalty:
    value: 25.0
    unit: dimensionless
