# Guidance-level platform envelopes.  Every leaf is {value, unit, source}.
# Consumed by interceptor/guidance/platform.py::load_platforms.
#
# Quad values below are analytic thrust-to-weight bounds; P4.9 replaces them
# with measured values from the validated 500 Hz flight-control stack.
#
# P4.9 status: the closed-loop limits measured with the B1 stack are in the
# `quad_closed_loop_limits` block at the end of this file (not in `platforms`).
# The `platforms.quadcopter` entry below is the kinematic benchmark envelope that
# the legacy-parity fixtures were recorded against, so it is left unchanged; the
# closed-loop study (P8.6) uses the measured block.

platforms:
  quadcopter:
    description: "Crazyflie 2.1 interceptor, omnidirectional; envelope measured in closed loop (P4.9)"
    v_min:
      value: 0.0
      unit: m/s
      source: "Multirotor can hover; EQ-KIN-1"
    v_max:
      value: 27.7
      unit: m/s
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); v_max_measured = 27.67 m/s with rotor drag (0.5, 0.5, 0.5) 1/s. Top speed is drag-limited and the drag coefficients are assumed (BUGS #27): 21.99 m/s with the earlier kz = 0.7; sensitivity in results/tables/quad_limits_repeatability.csv. Changed 2026-11-14 from the unsupported 45 m/s estimate"
    a_t_max:
      value: 15.4
      unit: m/s^2
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); omnidirectional vehicle, along-track limit = measured lateral limit 15.37 m/s^2. Changed from 3.2 g analytic"
    a_t_min:
      value: -15.4
      unit: m/s^2
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); omnidirectional vehicle, symmetric along-track limit. Changed from -3.2 g analytic"
    a_n_max:
      value: 15.4
      unit: m/s^2
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); lateral_a_max_measured = 15.37 m/s^2 (analytic g sqrt(TW^2-1) = 17.5). Changed from 5.2 g analytic"
    a_n_down_max:
      value: 9.5
      unit: m/s^2
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); vertical_down_a_max_measured = 9.51 m/s^2"
    tau_accel:
      value: 0.17
      unit: s
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); tau_accel_s = 0.174, consistent with 1/Kp of the Crazyflie firmware attitude loop (PID_ROLL_KP 6.0, https://github.com/bitcraze/crazyflie-firmware/blob/master/src/platform/interface/platform_defaults_cf2.h)"
    max_jerk:
      value: 88.3
      unit: m/s^3
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); max_jerk_m_s3 = 88.34 = a_n_max / tau_accel; EQ-KIN-3"
    omega_max:
      value: 4.4
      unit: rad/s
      source: "Measured on the validated 500 Hz Crazyflie flight-control stack, plan P4.9: results/tables/quad_limits.json (scripts/measure_quad_limits.py); peak_rate_hard_attitude_step = 4.39 rad/s"
    can_hover:
      value: true
      unit: dimensionless
      source: "Multirotor thrust exceeds weight; EQ-KIN-1"
    omnidirectional:
      value: true
      unit: dimensionless
      source: "Thrust vector can point in any direction; EQ-KIN-2"
    kill_radius:
      value: 1.3
      unit: m
      source: "Hit-to-kill contact rule r_kill = target half-span + interceptor half-span (EQ-GEO-4); no warhead is assumed because no credible lethal-radius data exists (data/lethality_and_gload.csv): 2.5/2 + 0.092/2 = 1.30 m. Shahed-136 wingspan 2.5 m (IRGC specification poster reported by Janes, https://www.janes.com/osint-insights/defence-news/air/irgc-confirms-specs-for-shahed-136-attack-uav); Crazyflie 2.1 size 92 mm motor-to-motor (Bitcraze datasheet, https://www.bitcraze.io/documentation/hardware/crazyflie_2_1/crazyflie_2_1-datasheet.pdf). Changed 2026-11-14 from 3.0 m"
    r_init_min:
      value: 92.0
      unit: m
      source: "Same 10 s minimum time-to-intercept window as before, scaled to the measured speed class (150 m x 27.7/45); EQ-GEO-5 (project choice)"
    r_init_max:
      value: 277.0
      unit: m
      source: "Same 25 s maximum time-to-intercept window as before, scaled to the measured speed class (450 m x 27.7/45); EQ-GEO-5 (project choice)"
    alt_init:
      value: 150.0
      unit: m
      source: "Above 35 m target floor plus 8 s vertical manoeuvre margin; EQ-GEO-6"
    v_target_nominal:
      value: 18.3
      unit: m/s
      source: "v_max / speed_ratio = 27.7 / 1.51; the Crazyflie-class model cannot fly real attack-drone speeds, so the real interceptor/target speed ratio is preserved: Wild Hornets Sting official maximum speed 280 km/h (manufacturer product page 'Ukrainian FPV Interceptor STING by Wild Hornets': 'Maximum speed: 280 km/h'; page needs a login, text read by the project author 2026-11-14; also reported by https://www.runtimewire.com/article/wild-hornets-sting-interceptor-speed-tradeoff) over Shahed-136 speed 185 km/h (Janes, Binnie J. (17 May 2023) 'IRGC confirms specs for Shahed-136 attack UAV': IRGC exhibition poster, Qom, gives 185 km/h, 200 kg, 50 kg warhead, 2500 km, https://www.janes.com/osint-insights/defence-news/air/irgc-confirms-specs-for-shahed-136-attack-uav; no manufacturer datasheet has been released for the Shahed-136). Speed ratio is swept 0.3-1.1 in P9.1; EQ-TGT-1"
    a_target_max:
      value: 7.404
      unit: m/s^2
      source: "a_n_max / a_ratio = 15.4 / 2.08; a_ratio is the Q5 project choice (no g data exists for one-way attack drones), swept in P9; EQ-TGT-1"
    dt:
      value: 0.02
      unit: s
      source: "Decision rate S8: 50 Hz guidance decision"
    max_time:
      value: 18.0
      unit: s
      source: "Guidance geometry: longest spawn at 25 m/s closing; EQ-GEO-5"
    speed_ratio:
      value: 1.51
      unit: dimensionless
      source: "Real fielded pair: Wild Hornets Sting official maximum speed 280 km/h (manufacturer product page 'Ukrainian FPV Interceptor STING by Wild Hornets': 'Maximum speed: 280 km/h'; page needs a login, text read by the project author 2026-11-14; also reported by https://www.runtimewire.com/article/wild-hornets-sting-interceptor-speed-tradeoff) / Shahed-136 185 km/h (Janes, Binnie J. (17 May 2023) 'IRGC confirms specs for Shahed-136 attack UAV': IRGC exhibition poster, Qom, gives 185 km/h, 200 kg, 50 kg warhead, 2500 km, https://www.janes.com/osint-insights/defence-news/air/irgc-confirms-specs-for-shahed-136-attack-uav) = 280/185. Spread: CSIS Missile Threat 'Shahed-131 and -136 at a Glance' gives 180 km/h (page read by the project author 2026-11-14; ratio 1.56); Sting record 315 km/h (ratio 1.70); swept in P9.1; EQ-TGT-1"
    a_ratio:
      value: 2.08
      unit: dimensionless
      source: "Q5 baseline interceptor/target accel ratio = 51.012/24.525; EQ-TGT-1"

  fixed_wing:
    description: "Aerosonde fixed-wing interceptor, non-holonomic"
    v_min:
      value: 15.0
      unit: m/s
      source: "configs/airframes/aerosonde.yaml derived_limits.v_min: EQ-FW-2 with CL_max = 1.45 (PROJECT_CHOICE, BUGS #32)"
    v_max:
      value: 32.4
      unit: m/s
      source: "configs/airframes/aerosonde.yaml derived_limits.v_max: DERIVED (EQ-FW-3): full-throttle root of T(V) = D(V) at sea level, 32.43 m/s rounded; thrust from the Beard & McLain propulsion model (uavbook draft 2025-10-02 eqs. 4.17-4.22) with the mavsim_public Aerosonde parameters, drag C_D = C_Dp + C_L^2/(pi e AR); computed by interceptor/guidance/airframes.py::aerosonde_max_level_speed, checked by tests/unit/test_equations_and_airframes.py. Changed 2026-11-15 from the v1-notebook 40 m/s (BUGS #32)"
    a_t_max:
      value: 2.47
      unit: m/s^2
      source: "configs/airframes/aerosonde.yaml derived_limits.a_t_max: DERIVED (EQ-FW-4): (T_max - D)/m at the 25 m/s trim speed (mavsim u0), full throttle, same model as v_max; interceptor/guidance/airframes.py::aerosonde_axial_acceleration(25, 1). Speed dependent (4.9 m/s^2 at 15 m/s, 0 at v_max); the constant is tested by the axial_limit_scale sweep. Changed 2026-11-15 from the v1-notebook 4.2 g (BUGS #32)"
    a_t_min:
      value: -3.02
      unit: m/s^2
      source: "configs/airframes/aerosonde.yaml derived_limits.a_t_min: DERIVED (EQ-FW-4): (T_idle - D)/m at 25 m/s with zero throttle (windmilling propeller), same model as v_max; interceptor/guidance/airframes.py::aerosonde_axial_acceleration(25, 0). Changed 2026-11-15 from the v1-notebook -2 g (BUGS #32)"
    a_n_max:
      value: 37.278
      unit: m/s^2
      source: "3.8 g positive limit manoeuvring load factor, normal category: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf; the same +3.8 g is used as a UAV design requirement (data/lethality_and_gload.csv G01). Structural limit governs above 28.5 m/s, where the aerodynamic limit 0.5 rho V^2 S CL_max/(m g) exceeds 3.8 (EQ-FW-5). Changed 2026-11-14 from the unsourced 10.5 g"
    a_n_down_max:
      value: 14.911
      unit: m/s^2
      source: "0.4 x positive limit load factor = 1.52 g, normal category: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf. Changed 2026-11-14 from the unsourced 5.0 g"
    tau_accel:
      value: 0.12
      unit: s
      source: "PROJECT_CHOICE, v1 notebook value; not found in the companion textbook (configs/airframes/aerosonde.yaml derived_limits.tau_accel, BUGS #32); EQ-FW-7"
    max_jerk:
      value: 180.0
      unit: m/s^3
      source: "PROJECT_CHOICE: kept below a_n_max / tau_accel = 37.278 / 0.12 = 311 m/s^3 (configs/airframes/aerosonde.yaml derived_limits.max_jerk); EQ-FW-7"
    omega_max:
      value: 1.44
      unit: rad/s
      source: "Coordinated turn g sqrt(n^2-1)/V at 25 m/s trim and n = 3.8 (14 CFR 23.337); EQ-FW-6"
    can_hover:
      value: false
      unit: dimensionless
      source: "Fixed-wing lift vanishes at zero speed; EQ-KIN-1"
    omnidirectional:
      value: false
      unit: dimensionless
      source: "Thrust acts along body x only; EQ-KIN-2"
    kill_radius:
      value: 3.0
      unit: m
      source: "Hit-to-kill contact rule r_kill = target half-span + interceptor half-span (EQ-GEO-4); no warhead is assumed because no credible lethal-radius data exists (data/lethality_and_gload.csv): 3.1/2 + 2.8956/2 = 3.00 m. Orlan-10 reconnaissance UAV (Special Technology Center): cruising speed 110 km/h = 30.6 m/s, maximum 150 km/h, wingspan 3.1 m, MTOW 16.5 kg (Airforce Technology project profile, 24 Mar 2023, https://www.airforce-technology.com/projects/orlan-10-unmanned-aerial-vehicle-uav/, read 2026-11-14; trade press, no manufacturer datasheet read; other secondary sources give 90-100 km/h cruise); Aerosonde span 2.8956 m (mavsim_public aerosonde_parameters.py). Changed 2026-11-14 from 7.45 m (TB2 target)"
    r_init_min:
      value: 400.0
      unit: m
      source: "16 s at 25 m/s closing; EQ-GEO-5"
    r_init_max:
      value: 900.0
      unit: m
      source: "36 s at 25 m/s closing; EQ-GEO-5"
    alt_init:
      value: 1000.0
      unit: m
      source: "Above 35 m target floor plus 965 m manoeuvre margin; EQ-GEO-6"
    v_target_nominal:
      value: 30.6
      unit: m/s
      source: "Orlan-10 reconnaissance UAV (Special Technology Center): cruising speed 110 km/h = 30.6 m/s, maximum 150 km/h, wingspan 3.1 m, MTOW 16.5 kg (Airforce Technology project profile, 24 Mar 2023, https://www.airforce-technology.com/projects/orlan-10-unmanned-aerial-vehicle-uav/, read 2026-11-14; trade press, no manufacturer datasheet read; other secondary sources give 90-100 km/h cruise; secondary source, data/threat_platforms.csv T16). Changed 2026-11-14 from the Bayraktar TB2 (46.3 m/s, Baykar), which is faster than the Aerosonde interceptor (then modelled at 40 m/s, now 32.4 m/s) and gave 2/30 pure-APN kills (BUGS #24); the TB2 and Shahed-136 (51 m/s) cases are covered by the P9.1 target_speed_ratio sweep up to 1.1"
    a_target_max:
      value: 37.278
      unit: m/s^2
      source: "Target UAV limited to the same 3.8 g normal-category limit load factor: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf; EQ-TGT-1. Changed 2026-11-14 from 4.2 g"
    dt:
      value: 0.02
      unit: s
      source: "Decision rate S8: 50 Hz guidance decision"
    max_time:
      value: 36.0
      unit: s
      source: "Spawn range / closing speed + 4 s; EQ-GEO-5"
    speed_ratio:
      value: 1.06
      unit: dimensionless
      source: "Interceptor/target speed ratio = 32.4/30.6; EQ-TGT-1; follows v_target_nominal (Orlan-10 cruise, Airforce Technology) and the model v_max (BUGS #32)"
    a_ratio:
      value: 1.0
      unit: dimensionless
      source: "Interceptor/target accel ratio = 37.278/37.278; EQ-TGT-1"

  missile:
    description: "AIM5 missile interceptor, boost-coast"
    v_min:
      value: 180.0
      unit: m/s
      source: "configs/airframes/aim5.yaml derived_limits; EQ-MS-2"
    v_max:
      value: 1200.0
      unit: m/s
      source: "configs/airframes/aim5.yaml derived_limits; EQ-MS-3 | Cross-check: Astra Mk1 max speed Mach 4.5 = 1348 m/s at 10 km ISA and Akash Mach 1.8-2.5 (Bharat Dynamics manufacturer PDF, read 2026-11-15; data source, data/interceptor_platforms.csv I01 I04); IRIS-T SLM 1000 m/s is Wikipedia only (I15: Diehl publishes no missile speed)"
    a_t_max:
      value: 176.58
      unit: m/s^2
      source: "configs/airframes/aim5.yaml derived_limits; 18 g; EQ-MS-4"
    a_t_min:
      value: -39.24
      unit: m/s^2
      source: "configs/airframes/aim5.yaml derived_limits; -4 g; EQ-MS-4"
    a_n_max:
      value: 358.1
      unit: m/s^2
      source: "configs/airframes/aim5.yaml derived_limits; CADAC 35 deg at Q12; EQ-MS-1"
    a_n_down_max:
      value: 358.1
      unit: m/s^2
      source: "configs/airframes/aim5.yaml derived_limits; symmetric; EQ-MS-1"
    tau_accel:
      value: 0.1
      unit: s
      source: "configs/airframes/aim5.yaml CADAC tr; EQ-MS-6"
    max_jerk:
      value: 1000.0
      unit: m/s^3
      source: "configs/airframes/aim5.yaml derived_limits; EQ-MS-6"
    omega_max:
      value: 12.0
      unit: rad/s
      source: "a_n_max/v at Q12; EQ-MS-5"
    can_hover:
      value: false
      unit: dimensionless
      source: "Lift-dependent missile; EQ-KIN-1"
    omnidirectional:
      value: false
      unit: dimensionless
      source: "Thrust along body x; EQ-KIN-2"
    kill_radius:
      value: 4.98
      unit: m
      source: "Hit-to-kill contact rule r_kill = target half-span + interceptor half-span (EQ-GEO-4); no warhead is assumed because no credible lethal-radius data exists (data/lethality_and_gload.csv): 9.8/2 + 0.15/2 = 4.98 m. F-16C wingspan 32 ft 8 in (9.8 m) (US Air Force fact sheet F-16 Fighting Falcon (Air Combat Command), https://www.af.mil/About-Us/Fact-Sheets/Display/Article/104505/f-16-fighting-falcon/ (verified via Wayback snapshot 20251231004314)); AIM5 diameter 0.15 m (Zipfel CADAC AIM5). Changed 2026-11-14 from 10 m"
    r_init_min:
      value: 3500.0
      unit: m
      source: "8.75 s at 400 m/s closing; EQ-GEO-5 | Cross-check: inside the 13 km terminal active-radar-homing range of Astra Mk1 (Bharat Dynamics manufacturer PDF, read 2026-11-15; data source, data/interceptor_sensors.csv S03)"
    r_init_max:
      value: 7000.0
      unit: m
      source: "17.5 s at 400 m/s closing; EQ-GEO-5 | Cross-check: inside the 13 km terminal active-radar-homing range of Astra Mk1 (Bharat Dynamics manufacturer PDF, read 2026-11-15; data source, data/interceptor_sensors.csv S03)"
    alt_init:
      value: 4500.0
      unit: m
      source: "Above 35 m target floor plus 4465 m manoeuvre margin; EQ-GEO-6 | Cross-check: below the 20 km ceilings of Astra Mk1 and Akash (Bharat Dynamics manufacturer PDF, read 2026-11-15; data source, data/interceptor_sensors.csv S03; data source, data/interceptor_platforms.csv I01) and the F-16C service ceiling above 50,000 ft (US Air Force fact sheet; data source, data/threat_platforms.csv T03)"
    v_target_nominal:
      value: 400.0
      unit: m/s
      source: "Q5 baseline: 1/3 of missile v_max; configs/guidance.yaml | Cross-check: 400 m/s = Mach 1.34 at 10 km ISA (a = 299.5 m/s), inside the fighter envelope of F-16C 1,500 mph, Mach 2 at altitude (US Air Force fact sheet F-16 Fighting Falcon (Air Combat Command), https://www.af.mil/About-Us/Fact-Sheets/Display/Article/104505/f-16-fighting-falcon/ (verified via Wayback snapshot 20251231004314)); Mach 2 at 10 km ISA = 599 m/s, so 400 m/s is 67 % of the F-16 top speed"
    a_target_max:
      value: 88.29
      unit: m/s^2
      source: "9 g fighter structural/FCS limit: F-16C 'can withstand up to nine G's' with full internal fuel (US Air Force fact sheet F-16 Fighting Falcon (Air Combat Command), https://www.af.mil/About-Us/Fact-Sheets/Display/Article/104505/f-16-fighting-falcon/ (verified via Wayback snapshot 20251231004314)); secondary cross-checks J-20 +9 g, JF-17 Block III +8 g (data/threat_platforms.csv T02 T04, not used for the value); was 11 g before 2026-11-14; EQ-TGT-1"
    dt:
      value: 0.02
      unit: s
      source: "Decision rate S8: 50 Hz guidance decision"
    max_time:
      value: 20.0
      unit: s
      source: "Spawn range / closing speed; EQ-GEO-5"
    speed_ratio:
      value: 1.5
      unit: dimensionless
      source: "Q5 baseline interceptor/target speed ratio = 600/400 at Q12; EQ-TGT-1"
    a_ratio:
      value: 4.06
      unit: dimensionless
      source: "Interceptor/target accel ratio = 358.1/88.29; EQ-TGT-1; follows a_target_max = 9 g from the US Air Force F-16 fact sheet (data source, data/threat_platforms.csv T03); the JF-17 +8 g and J-20 +9 g figures (T02, T04, Wikipedia; no primary reachable or published) only corroborate it"

# P5.8: per-platform observation normalisation (fix F18).  Divisors keep the
# actor frame, history and future blocks O(1) on every vehicle.  Lengths use
# r_init_max, speeds v_max, times max_time, accelerations a_n_max /
# a_target_max from the platform entries above (same values unless the entry
# is revised by a later phase).  Consumed by
# interceptor/guidance/observation.py::load_observation_scales.
