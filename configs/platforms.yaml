    time_remaining: {value: 36.0, unit: s, source: "P5.8: max_time, EQ-GEO-5"}
    optimal_accel: {value: 37.278, unit: m/s^2, source: "P5.8: a_n_max, EQ-FW-5"}
    optimal_vel: {value: 32.4, unit: m/s, source: "P5.8: v_max, EQ-FW-3"}
