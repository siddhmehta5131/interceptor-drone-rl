# model.yaml -- model definitions for the APN + RL interceptor (plan §12).
#
# Each top-level key is a `model_id` -- a valid Python identifier so it can be
# used as an attribute on the `TrainResult` returned by `train_model()`
# (e.g. `result.ppo_interceptor`).
#
# This is the ONLY place where model architecture lives.  Training settings
# live in `config.yaml`; the curriculum lives in `stages.yaml`.
#
# Fields
# ------
#   algo               PPO (only PPO is implemented in this stage)
#   policy             MlpPolicy (auto-upgraded to AsymmetricActorCriticPolicy
#                      when `privileged_critic` is non-empty)
#   net_arch           {pi: [...], vf: [...]}  actor / critic MLP widths
#   activation         ReLU | Tanh | ELU
#   obs_history        {frames: m, skip: p} -- must match config.observation
#   hyperparameters    passed straight to SB3
#   privileged_critic  critic-only observation fields the actor never sees.
#                      Supported names (see src/envs/obs_builder.PRIVILEGED_FIELDS):
#                        time_remaining
#                        optimal_accel
#                        optimal_vel
#                        target_true_future_pos
#                        target_true_future_vel
#                        target_true_accel

ppo_interceptor:
  algo: PPO
  policy: MlpPolicy
  net_arch: {pi: [256, 256, 128], vf: [256, 256, 128]}
  activation: ReLU
  obs_history: {frames: 3, skip: 2}
  hyperparameters:
    n_steps: 4096
    batch_size: 512
    gamma: 0.995
    learning_rate: 3.0e-4
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.005
    n_epochs: 10
    max_grad_norm: 0.5
    vf_coef: 0.5
  privileged_critic:
    - time_remaining
    - optimal_accel
    - optimal_vel
    - target_true_future_pos
    - target_true_future_vel
    - target_true_accel
