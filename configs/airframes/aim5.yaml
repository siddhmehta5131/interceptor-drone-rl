  speed_of_sound:
    value: 299.5
    unit: m/s
    source: "ISA standard atmosphere at 10 km"
  speed:
    value: 599.0
    unit: m/s
    source: "Mach 2 x 299.5 m/s at 10 km"

derived_limits:
