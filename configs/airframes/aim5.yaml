# AIM5 air-to-air missile -- CADAC++ data decks (Zipfel, AIAA ARC).
# Data copied from SwaggyTyrion/CADAC example/AIM5:
#   aim5_prop_deck.asc, aim5_aero_deck.asc, input.asc, aim_modules.cpp
# CADAC repository is MIT; the numerical decks originate from Zipfel's book
# supplement.  Only numerical data is used, with citation.

airframe: "AIM5"
primary_source: "Zipfel, Modeling and Simulation of Aerospace Vehicle Dynamics; CADAC++ example/AIM5 data decks"
license: "CADAC repository MIT; data attributed to Zipfel book supplement; no source code copied"

