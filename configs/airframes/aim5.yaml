    value: 1200.0
    unit: m/s
    source: "Boost-phase speed envelope, 18 g axial cap; docs/mathematics.md EQ-MS-3"
  a_t_max:
    value: 176.58
    unit: m/s^2
    source: "18 g axial limit, decision Q11; docs/mathematics.md EQ-MS-4"
  a_t_min:
    value: -39.24
    unit: m/s^2
    source: "-4 g deceleration/drag limit; docs/mathematics.md EQ-MS-4"
  a_n_max:
    value: 358.1
    unit: m/s^2
    source: "CADAC alpmax=35 deg at 10 km Mach 2 post-burnout; 36.5 g; EQ-MS-1"
  a_n_down_max:
    value: 358.1
    unit: m/s^2
    source: "Symmetric normal-force limit at alpmax; EQ-MS-1"
  omega_max:
    value: 12.0
    unit: rad/s
    source: "a_n_max / speed at Q12; docs/mathematics.md EQ-MS-5"
  tau_accel:
    value: 0.1
    unit: s
    source: "CADAC autopilot rate-loop time constant tr; EQ-MS-6"
  max_jerk:
    value: 1000.0
    unit: m/s^3
    source: "a_n_max / (4 tau_accel) rounded; EQ-MS-6"
