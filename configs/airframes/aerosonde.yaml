    source: "mavsim_public aerosonde_parameters.py L86 C_ell_delta_r = 0.0024 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.0024"
  Cn_delta_r:
