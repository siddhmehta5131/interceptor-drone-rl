# Aerosonde fixed-wing airframe -- Beard & McLain, Small Unmanned Aircraft.
# Numerical data copied from BYU-MAGICC mavsim_public
# mavsim_python/parameters/aerosonde_parameters.py (GPL-3.0; data only, cited)
# and the textbook Appendix E tables.  No source code is copied.

airframe: "Aerosonde Mk 4.7"
primary_source: "Beard & McLain (2012), Small Unmanned Aircraft: Theory and Practice, Appendix E; byu-magicc/mavsim_public aerosonde_parameters.py"
license: "Data cited from GPL-3.0 repository; numerical values are facts, no code copied"

physical:
  mass:
    value: 11.0
    unit: kg
    source: "mavsim_public aerosonde_parameters.py L32 mass = 11. (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: m = 11.0 kg"
  inertia:
    value: [0.8244, 1.135, 1.759]
    unit: kg m^2
    source: "mavsim_public aerosonde_parameters.py L33-35 Jx = 0.8244, Jy = 1.135, Jz = 1.759 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: 0.824 / 1.135 / 1.759 kg m^2 (3 significant figures)"
  inertia_xz:
    value: 0.1204
    unit: kg m^2
    source: "mavsim_public aerosonde_parameters.py L36 Jxz = 0.1204 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: 0.120 kg m^2"
  wing_area:
    value: 0.55
    unit: m^2
    source: "mavsim_public aerosonde_parameters.py L37 S_wing = 0.55 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: S = 0.55 m^2"
  wing_span:
    value: 2.8956
    unit: m
    source: "mavsim_public aerosonde_parameters.py L38 b = 2.8956 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: b = 2.9 m (rounded)"
  chord:
    value: 0.18994
    unit: m
    source: "mavsim_public aerosonde_parameters.py L39 c = 0.18994 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: c = 0.19 m (rounded)"
  aspect_ratio:
    value: 15.24
    unit: dimensionless
    source: "b^2/S_wing = 2.8956^2 / 0.55 = 15.2445, rounded; same formula as mavsim_public aerosonde_parameters.py L43 AR = (b**2) / S_wing"
  oswald_efficiency:
    value: 0.9
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L42 e = 0.9 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: e = 0.9"
  air_density_sea_level:
    value: 1.2682
    unit: kg/m^3
    source: "mavsim_public aerosonde_parameters.py L41 rho = 1.2682 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: rho = 1.268 kg/m^3. The book's single density value (3.5 % above ISA sea level 1.225); the key name says sea level but the book does not state an altitude"
  propeller_area:
    value: 0.2027
    unit: m^2
    source: "mavsim_public aerosonde_parameters.py L40 S_prop = 0.2027 (commit 10363e0, read 2026-11-15); not in the draft Table E.1 (it belongs to the first-edition propeller model; unused by this project)"
  propeller_diameter:
    value: 0.508
    unit: m
    source: "mavsim_public aerosonde_parameters.py L93 D_prop = 20*(0.0254) (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: D_prop = 0.508 m (APC 20x10E, App. E text)"
  motor_kv:
    value: 145.0
    unit: rpm/V
    source: "mavsim_public aerosonde_parameters.py L96 KV_rpm_per_volt = 145. (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: K_V = 0.0659 V-s/rad = 60 / (2 pi 145) (L97; book ch. 4 footnote p. 58)"
  motor_resistance:
    value: 0.042
    unit: ohm
    source: "mavsim_public aerosonde_parameters.py L99 R_motor = 0.042 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: R_motor = 0.042 ohm"
  motor_no_load_current:
    value: 1.5
    unit: A
    source: "mavsim_public aerosonde_parameters.py L100 i0 = 1.5 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: i0 = 1.5 A"
  battery_cells:
    value: 12
    unit: cells
    source: "mavsim_public aerosonde_parameters.py L104 ncells = 12. (commit 10363e0, read 2026-11-15); not listed in Table E.1 (implied by V_max = 44.4 V = 12 x 3.7 V)"
  battery_voltage_max:
    value: 44.4
    unit: V
    source: "mavsim_public aerosonde_parameters.py L105 V_max = 3.7 * ncells (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: V_max = 44.4 V"
  gravity:
    value: 9.81
    unit: m/s^2
    source: "Standard gravity 9.80665 m/s^2 rounded to 9.81, the value in mavsim_public aerosonde_parameters.py L44 gravity = 9.81 (commit 10363e0, read 2026-11-15)"

