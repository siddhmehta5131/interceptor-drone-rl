    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L80 C_ell_r = 0.25 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.25"
  Cn_r:
    value: -0.095
    unit: dimensionless
