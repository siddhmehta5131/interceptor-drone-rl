propeller_fit:
  CT_coefficients:
    value: [0.09357, -0.06044, -0.1079]
    unit: "CT = C_T0 + C_T1 J + C_T2 J^2"
    source: "mavsim aerosonde_parameters.py C_T0,C_T1,C_T2"
  CQ_coefficients:
    value: [0.005230, 0.004970, -0.01664]
    unit: "CQ = C_Q0 + C_Q1 J + C_Q2 J^2"
    source: "mavsim aerosonde_parameters.py C_Q0,C_Q1,C_Q2"

derived_limits:
  v_min:
    value: 15.0
    unit: m/s
    source: "Stall speed from CL_max=1.45 at sea level; docs/mathematics.md EQ-FW-2"
  v_max:
    value: 40.0
    unit: m/s
    source: "Level-flight thrust=drag root at 25 m/s trim; docs/mathematics.md EQ-FW-3"
  a_t_max:
    value: 41.202
    unit: m/s^2
    source: "4.2 g excess-thrust limit at sea level; docs/mathematics.md EQ-FW-4"
  a_t_min:
    value: -19.62
    unit: m/s^2
    source: "-2.0 g idle-thrust/drag limit; docs/mathematics.md EQ-FW-4"
  a_n_max:
    value: 37.278
    unit: m/s^2
    source: "3.8 g positive limit manoeuvring load factor, normal category: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf; the same +3.8 g is used as a UAV design requirement (data/lethality_and_gload.csv G01). Structural limit governs above 28.5 m/s, where the aerodynamic limit 0.5 rho V^2 S CL_max/(m g) exceeds 3.8 (EQ-FW-5). Changed 2026-11-14 from the unsourced 10.5 g"
  a_n_down_max:
    value: 14.911
    unit: m/s^2
    source: "0.4 x positive limit load factor = 1.52 g, normal category: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf. Changed 2026-11-14 from the unsourced 5.0 g"
  omega_max:
    value: 1.44
    unit: rad/s
    source: "Coordinated turn g sqrt(n^2-1)/V at 25 m/s trim and n = 3.8 (14 CFR 23.337); EQ-FW-6"
  tau_accel:
    value: 0.12
    unit: s
    source: "Roll/pitch first-order response fit, Beard & McLain control chapter; EQ-FW-7"
  max_jerk:
    value: 180.0
    unit: m/s^3
    source: "Kept at 180 m/s^3, below a_n_max / tau_accel = 37.278 / 0.12 = 311; EQ-FW-7 (project choice)"
