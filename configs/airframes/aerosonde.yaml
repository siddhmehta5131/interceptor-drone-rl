    unit: cells
    source: "mavsim aerosonde_parameters.py ncells"
  battery_voltage_max:
    value: 44.4
    unit: V
    source: "12 cells x 3.7 V; mavsim aerosonde_parameters.py V_max"
  gravity:
    value: 9.81
    unit: m/s^2
    source: "Standard gravity 9.80665 m/s^2 rounded to 9.81, the value in mavsim_public aerosonde_parameters.py (https://github.com/byu-magicc/mavsim_public/blob/main/mavsim_python/parameters/aerosonde_parameters.py)"

