    source: "mavsim_public aerosonde_parameters.py L52 C_L_alpha = 5.61 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 5.61"
  CD_alpha:
    value: 0.132
    unit: 1/rad
    source: "mavsim_public aerosonde_parameters.py L53 C_D_alpha = 0.132 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.132"
  Cm_alpha:
    value: -2.74
    unit: 1/rad
    source: "mavsim_public aerosonde_parameters.py L54 C_m_alpha = -2.74 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: -2.74"
  CL_q:
    value: 7.95
