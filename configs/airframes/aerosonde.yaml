    source: "mavsim_public aerosonde_parameters.py L55 C_L_q = 7.95 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 7.95"
  Cm_q:
    value: -38.21
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L57 C_m_q = -38.21 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: -38.21"
  CL_delta_e:
    value: 0.13
    unit: 1/rad
    source: "mavsim_public aerosonde_parameters.py L58 C_L_delta_e = 0.13 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.13"
  CD_delta_e:
    value: 0.0135
    unit: 1/rad
    source: "mavsim_public aerosonde_parameters.py L59 C_D_delta_e = 0.0135 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.0135"
  Cm_delta_e:
    value: -0.99
    unit: 1/rad
    source: "mavsim_public aerosonde_parameters.py L60 C_m_delta_e = -0.99 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: -0.99"
  CD_p:
    value: 0.043
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L64 C_D_p = 0.043 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.043"
  M:
    value: 50.0
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L61 M = 50.0 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: M = 50, the transition rate of the stall blending function sigma(alpha), eq. (4.10) p. 49 (not a pitch-damping term)"
  epsilon:
    value: 0.16
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L63 epsilon = 0.16 (commit 10363e0, read 2026-11-15); not listed in the draft Table E.2; unused by this project"
  CY_beta:
    value: -0.98
    unit: 1/rad
    source: "mavsim_public aerosonde_parameters.py L73 C_Y_beta = -0.98 (commit 10363e0, read 2026-11-15). uavbook draft 2025-10-02 Table E.2 p. 358 gives -0.83: the code differs from the book; the mavsim README (L38) recommends the code's 'slightly modified from the book' Aerosonde coefficients. Lateral derivatives are not used by the point-mass model, so no result depends on it"
