  CL_0:
    value: 0.23
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L49 C_L_0 = 0.23 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.23"
  CD_0:
    value: 0.0424
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L50 C_D_0 = 0.0424 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.0424"
  Cm_0:
    value: 0.0135
    unit: dimensionless
    source: "mavsim_public aerosonde_parameters.py L51 C_m_0 = 0.0135 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.2 p. 358: 0.0135"
  CL_alpha:
