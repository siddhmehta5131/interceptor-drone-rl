propeller_fit:
  CT_coefficients:
    value: [0.09357, -0.06044, -0.1079]
    unit: "CT = C_T0 + C_T1 J + C_T2 J^2"
    source: "mavsim_public aerosonde_parameters.py L113 C_T0 = 0.09357, L112 C_T1 = -0.06044, L111 C_T2 = -0.1079 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: same"
  CQ_coefficients:
    value: [0.005230, 0.004970, -0.01664]
    unit: "CQ = C_Q0 + C_Q1 J + C_Q2 J^2"
    source: "mavsim_public aerosonde_parameters.py L110 C_Q0 = 0.005230, L109 C_Q1 = 0.004970, L108 C_Q2 = -0.01664 (commit 10363e0, read 2026-11-15); uavbook draft 2025-10-02 Table E.1 p. 358: same"

derived_limits:
  v_min:
    value: 15.0
    unit: m/s
    source: "DERIVED (EQ-FW-2): V_stall = sqrt(2 m g / (rho S CL_max)) with m, rho, S from mavsim (L32, L41, L37) and CL_max = 1.45, a PROJECT_CHOICE: mavsim has no CL_max and the book blended lift curve eq. (4.9)-(4.10) peaks at 2.42 (alpha 23.6 deg, no viscous stall), which would give 11.3 m/s. 1.45 gives 14.6 m/s, rounded up to 15 (conservative lower speed bound; BUGS #32)"
  v_max:
    value: 40.0
    unit: m/s
    source: "PROJECT_CHOICE (v1 notebook value, archive/path_planning_updated_project): NOT the thrust = drag root claimed before. The book propulsion model (uavbook eqs. 4.17-4.22) with the mavsim parameters gives 32.4 m/s at full throttle (BUGS #32); kept at 40 pending the owner decision"
  a_t_max:
    value: 41.202
    unit: m/s^2
    source: "PROJECT_CHOICE (v1 notebook value): NOT an excess-thrust result of EQ-FW-4. The book propulsion model with the mavsim parameters gives (T - D)/m = 2.5 m/s^2 (0.25 g) at 25 m/s and at most 7.7 m/s^2 (static thrust 84.6 N) (BUGS #32); kept pending the owner decision"
  a_t_min:
    value: -19.62
    unit: m/s^2
    source: "PROJECT_CHOICE (v1 notebook value): NOT an idle-thrust result of EQ-FW-4. The book model gives (T_idle - D)/m = -3.0 m/s^2 (-0.31 g) at 25 m/s (BUGS #32); kept pending the owner decision"
  a_n_max:
    value: 37.278
    unit: m/s^2
    source: "3.8 g positive limit manoeuvring load factor, normal category: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf; the same +3.8 g is used as a UAV design requirement (data/lethality_and_gload.csv G01). Structural limit governs above 28.5 m/s, where the aerodynamic limit 0.5 rho V^2 S CL_max/(m g) exceeds 3.8 (EQ-FW-5). Changed 2026-11-14 from the unsourced 10.5 g"
  a_n_down_max:
    value: 14.911
    unit: m/s^2
    source: "0.4 x positive limit load factor = 1.52 g, normal category: 14 CFR 23.337 Limit maneuvering load factors (2011 ed., US Government Publishing Office), https://www.govinfo.gov/content/pkg/CFR-2011-title14-vol1/pdf/CFR-2011-title14-vol1-sec23-337.pdf. Changed 2026-11-14 from the unsourced 5.0 g"
  omega_max:
    value: 1.44
    unit: rad/s
    source: "Coordinated turn g sqrt(n^2-1)/V at 25 m/s trim and n = 3.8 (14 CFR 23.337); EQ-FW-6"
  tau_accel:
    value: 0.12
    unit: s
    source: "PROJECT_CHOICE (v1 notebook value): no 0.12 s roll/pitch time constant was found in the companion textbook (uavbook draft 2025-10-02 searched 2026-11-15), so the earlier attribution is withdrawn (BUGS #32); EQ-FW-7"
  max_jerk:
    value: 180.0
    unit: m/s^3
    source: "Kept at 180 m/s^3, below a_n_max / tau_accel = 37.278 / 0.12 = 311; EQ-FW-7 (project choice)"
