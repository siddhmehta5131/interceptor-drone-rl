# Aerosonde fixed-wing airframe -- Beard & McLain, Small Unmanned Aircraft.
# Numerical data copied from BYU-MAGICC mavsim_public
# mavsim_python/parameters/aerosonde_parameters.py (GPL-3.0; data only, cited)
# and the textbook Appendix E tables.  No source code is copied.

airframe: "Aerosonde Mk 4.7"
primary_source: "Beard & McLain (2012), Small Unmanned Aircraft: Theory and Practice, Appendix E; byu-magicc/mavsim_public aerosonde_parameters.py"
license: "Data cited from GPL-3.0 repository; numerical values are facts, no code copied"

physical:
  mass:
    value: 11.0
    unit: kg
    source: "Beard & McLain Appendix E; mavsim aerosonde_parameters.py mass"
  inertia:
    value: [0.8244, 1.135, 1.759]
    unit: kg m^2
    source: "Beard & McLain Appendix E; Jx, Jy, Jz"
  inertia_xz:
    value: 0.1204
    unit: kg m^2
    source: "Beard & McLain Appendix E; Jxz"
  wing_area:
    value: 0.55
    unit: m^2
    source: "Beard & McLain Appendix E; S_wing"
  wing_span:
    value: 2.8956
    unit: m
    source: "Beard & McLain Appendix E; b"
  chord:
    value: 0.18994
    unit: m
    source: "Beard & McLain Appendix E; c"
  aspect_ratio:
    value: 15.24
    unit: dimensionless
    source: "b^2/S_wing = 2.8956^2 / 0.55"
  oswald_efficiency:
    value: 0.9
    unit: dimensionless
    source: "Beard & McLain Appendix E; e"
  air_density_sea_level:
    value: 1.2682
    unit: kg/m^3
    source: "Beard & McLain Appendix E; rho at 25 m/s trim condition"
  propeller_area:
    value: 0.2027
    unit: m^2
    source: "Beard & McLain Appendix E; S_prop"
  propeller_diameter:
    value: 0.508
    unit: m
    source: "mavsim aerosonde_parameters.py D_prop = 20 inch"
  motor_kv:
    value: 145.0
    unit: rpm/V
    source: "mavsim aerosonde_parameters.py KV_rpm_per_volt"
  motor_resistance:
    value: 0.042
    unit: ohm
    source: "mavsim aerosonde_parameters.py R_motor"
  motor_no_load_current:
    value: 1.5
    unit: A
    source: "mavsim aerosonde_parameters.py i0"
  battery_cells:
